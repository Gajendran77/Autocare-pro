# =========================================
# AutoCare Pro - Application Configuration
# =========================================

spring.application.name=AutoCare Pro

# ---------- Server ----------
server.port=8080
server.error.include-message=always

# ---------- MySQL Datasource ----------
spring.datasource.url=jdbc:mysql://localhost:3306/autocare_pro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Gaja@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- SQL Initialization ----------
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ---------- Mail (Email Confirmation) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=false

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.autocarepro=DEBUG

# ---------- App Info ----------
app.name=AutoCare Pro
app.version=1.0.0