<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Vehicles')}"></head>
<body>
<div th:replace="~{fragments/loading :: loading}"></div>
<div th:replace="~{fragments/customer-sidebar :: sidebar('vehicles')}"></div>

<main class="main-content">
    <div th:replace="~{fragments/topbar :: topbar('My Vehicles')}"></div>

    <div class="d-flex justify-content-end mb-4">
        <button class="btn btn-gradient" data-bs-toggle="modal" data-bs-target="#addVehicleModal">
            <i class="fa-solid fa-plus me-2"></i>Add Vehicle
        </button>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="v : ${vehicles}">
            <div class="vehicle-card">
                <img th:src="${v.imageUrl}" alt="Vehicle">
                <div class="vehicle-body">
                    <h6 class="fw-bold mb-1" th:text="${v.brand + ' ' + v.model + ' (' + v.year + ')'}">BMW 3 Series</h6>
                    <p class="text-secondary small mb-1"><i class="fa-solid fa-hashtag me-1"></i><span th:text="${v.registrationNumber}"></span></p>
                    <p class="text-secondary small mb-1"><i class="fa-solid fa-gas-pump me-1"></i><span th:text="${v.fuelType}"></span></p>
                    <p class="text-secondary small mb-1"><i class="fa-solid fa-tag me-1"></i><span th:text="${v.vehicleType}"></span></p>
                    <p class="text-secondary small mb-0"><i class="fa-solid fa-calendar-check me-1"></i>Next service: <span th:text="${v.nextServiceDue}"></span></p>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(vehicles)}">
            <div class="glass-card text-center py-5">
                <i class="fa-solid fa-car fs-1 text-secondary mb-3 d-block"></i>
                <p class="text-secondary mb-0">No vehicles registered yet. Click "Add Vehicle" to get started.</p>
            </div>
        </div>
    </div>
</main>

<!-- Add Vehicle Modal -->
<div class="modal fade" id="addVehicleModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card border-0">
            <div class="modal-header border-0">
                <h5 class="font-display fw-bold">Add a Vehicle</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/customer/vehicles}" th:object="${vehicleRequest}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label-premium">Vehicle Type</label>
                        <select th:field="*{vehicleType}" class="form-select form-select-glass" required>
                            <option value="CAR">Car</option>
                            <option value="BIKE">Bike</option>
                            <option value="TRUCK">Truck</option>
                        </select>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label-premium">Brand</label>
                            <input type="text" th:field="*{brand}" class="form-control form-control-glass" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label-premium">Model</label>
                            <input type="text" th:field="*{model}" class="form-control form-control-glass" required>
                        </div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label-premium">Year</label>
                            <input type="number" th:field="*{year}" class="form-control form-control-glass" min="1980" max="2026">
                        </div>
                        <div class="col-6">
                            <label class="form-label-premium">Fuel Type</label>
                            <select th:field="*{fuelType}" class="form-select form-select-glass">
                                <option value="PETROL">Petrol</option>
                                <option value="DIESEL">Diesel</option>
                                <option value="ELECTRIC">Electric</option>
                                <option value="CNG">CNG</option>
                                <option value="HYBRID">Hybrid</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label-premium">Registration Number</label>
                        <input type="text" th:field="*{registrationNumber}" class="form-control form-control-glass" placeholder="e.g. DL01AB1234" required>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-gradient w-100"><i class="fa-solid fa-plus me-2"></i>Add Vehicle</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
