<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body>
<div th:replace="~{fragments/loading :: loading}"></div>

<div class="auth-wrapper">
    <div class="auth-visual d-none d-lg-flex" style="background-image: url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1200&q=80');">
        <div class="p-5 position-relative" style="z-index:2;">
            <span class="brand-logo fs-3"><i class="fa-solid fa-car-side me-1"></i>AutoCare Pro</span>
            <h2 class="font-display fw-bold text-white mt-4">Join the Premium<br>Service Network.</h2>
            <p class="text-white-50">Create your account as a customer or certified mechanic.</p>
        </div>
    </div>

    <div class="auth-form-panel py-5">
        <div class="glass-card p-5" style="width:100%; max-width: 460px;">
            <div class="text-center mb-4">
                <button class="theme-toggle-btn float-end"><i class="fa-solid fa-sun"></i></button>
                <h3 class="font-display fw-bold">Create Account</h3>
                <p class="text-secondary small">Join AutoCare Pro in seconds</p>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label-premium">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control form-control-glass" placeholder="John Doe" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label-premium">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control form-control-glass" placeholder="you@example.com" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label-premium">Phone Number</label>
                    <input type="text" th:field="*{phone}" class="form-control form-control-glass" placeholder="9876543210" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label-premium">Password</label>
                    <div class="position-relative">
                        <input type="password" id="regPassword" th:field="*{password}" class="form-control form-control-glass pe-5" placeholder="Minimum 6 characters" required>
                        <span class="toggle-password position-absolute" data-target="#regPassword" style="right:16px; top:12px; cursor:pointer; color:var(--text-muted);">
                            <i class="fa-solid fa-eye"></i>
                        </span>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label-premium">I am a</label>
                    <div class="row g-2">
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="role" id="roleCustomer" value="CUSTOMER" th:field="*{role}" checked>
                            <label class="btn btn-outline-glass w-100" for="roleCustomer"><i class="fa-solid fa-user me-1"></i> Customer</label>
                        </div>
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="role" id="roleMechanic" value="MECHANIC" th:field="*{role}">
                            <label class="btn btn-outline-glass w-100" for="roleMechanic"><i class="fa-solid fa-wrench me-1"></i> Mechanic</label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-gradient w-100 py-2 mb-3">Create Account <i class="fa-solid fa-user-plus ms-1"></i></button>
                <p class="text-center text-secondary small mb-0">Already have an account?
                    <a th:href="@{/login}" style="color:var(--blue-400);">Sign in</a>
                </p>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
