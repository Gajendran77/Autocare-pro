<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reset Password')}"></head>
<body>
<div th:replace="~{fragments/loading :: loading}"></div>
<div class="auth-wrapper justify-content-center">
    <div class="auth-form-panel">
        <div class="glass-card p-5" style="width:100%; max-width: 440px;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-lock fs-1 mb-3" style="color: var(--blue-400);"></i>
                <h3 class="font-display fw-bold">Reset Your Password</h3>
            </div>
            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="mb-4">
                    <label class="form-label-premium">New Password</label>
                    <input type="password" name="password" class="form-control form-control-glass" placeholder="Minimum 6 characters" required minlength="6">
                </div>
                <button type="submit" class="btn btn-gradient w-100 py-2">Reset Password <i class="fa-solid fa-check ms-1"></i></button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
