<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Forgot Password')}"></head>
<body>
<div th:replace="~{fragments/loading :: loading}"></div>
<div class="auth-wrapper justify-content-center">
    <div class="auth-form-panel">
        <div class="glass-card p-5" style="width:100%; max-width: 440px;">
            <div class="text-center mb-4">
                <i class="fa-solid fa-key fs-1 mb-3" style="color: var(--blue-400);"></i>
                <h3 class="font-display fw-bold">Forgot Password?</h3>
                <p class="text-secondary small">Enter your email and we'll send you a reset link</p>
            </div>
            <div th:if="${success}" class="alert alert-success py-2 small" th:text="${success}"></div>
            <form th:action="@{/forgot-password}" method="post">
                <div class="mb-4">
                    <label class="form-label-premium">Email Address</label>
                    <input type="email" name="email" class="form-control form-control-glass" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="btn btn-gradient w-100 py-2 mb-3">Send Reset Link <i class="fa-solid fa-paper-plane ms-1"></i></button>
                <p class="text-center text-secondary small mb-0">
                    <a th:href="@{/login}" style="color:var(--blue-400);"><i class="fa-solid fa-arrow-left me-1"></i>Back to Login</a>
                </p>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
