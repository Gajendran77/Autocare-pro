<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Inventory')}"></head>
<body>
<div th:replace="~{fragments/loading :: loading}"></div>
<div th:replace="~{fragments/admin-sidebar :: sidebar('inventory')}"></div>

<main class="main-content">
    <div th:replace="~{fragments/topbar :: topbar('Inventory Management')}"></div>

    <div class="glass-card p-0 overflow-hidden">
        <table class="table table-borderless mb-0 align-middle">
            <thead>
            <tr class="text-secondary small">
                <th class="ps-4">Item</th>
                <th>Category</th>
                <th>Stock</th>
                <th>Unit Price</th>
                <th>Reorder Level</th>
                <th class="pe-4">Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td class="ps-4 fw-semibold" th:text="${item.name}">Engine Oil (5L)</td>
                <td th:text="${item.category}">ENGINE</td>
                <td th:text="${item.stockQuantity}">40</td>
                <td th:text="'₹' + ${item.unitPrice}">₹2,200.00</td>
                <td th:text="${item.reorderLevel}">10</td>
                <td class="pe-4">
                    <span class="status-pill"
                          th:classappend="${item.status == 'IN_STOCK'} ? 'status-completed' : (${item.status == 'LOW_STOCK'} ? 'status-pending' : 'status-cancelled')"
                          th:text="${item.status}">IN STOCK</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="6" class="text-center text-secondary py-4">No inventory items yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
