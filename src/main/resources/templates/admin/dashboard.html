<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Dashboard')}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<div th:replace="~{fragments/loading :: loading}"></div>
<div th:replace="~{fragments/admin-sidebar :: sidebar('dashboard')}"></div>

<main class="main-content">
    <div th:replace="~{fragments/topbar :: topbar('Admin Overview')}"></div>

    <div class="row g-4 mb-4">
        <div class="col-6 col-lg-2 fade-up">
            <div class="stat-card">
                <div class="stat-icon icon-blue"><i class="fa-solid fa-users"></i></div>
                <div class="stat-value" th:data-counter="${stats.totalCustomers}">0</div>
                <div class="stat-label">Customers</div>
            </div>
        </div>
        <div class="col-6 col-lg-2 fade-up">
            <div class="stat-card">
                <div class="stat-icon icon-cyan"><i class="fa-solid fa-car"></i></div>
                <div class="stat-value" th:data-counter="${stats.totalVehicles}">0</div>
                <div class="stat-label">Vehicles</div>
            </div>
        </div>
        <div class="col-6 col-lg-3 fade-up">
            <div class="stat-card">
                <div class="stat-icon icon-gold"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                <div class="stat-value" th:text="'₹' + ${#numbers.formatDecimal(stats.totalRevenue, 0, 'COMMA', 0, 'POINT')}">₹0</div>
                <div class="stat-label">Total Revenue</div>
            </div>
        </div>
        <div class="col-6 col-lg-2 fade-up">
            <div class="stat-card">
                <div class="stat-icon icon-red"><i class="fa-solid fa-hourglass-half"></i></div>
                <div class="stat-value" th:data-counter="${stats.pendingServices}">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>
        <div class="col-6 col-lg-3 fade-up">
            <div class="stat-card">
                <div class="stat-icon icon-green"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-value" th:data-counter="${stats.completedServices}">0</div>
                <div class="stat-label">Completed Services</div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-lg-5">
            <div class="glass-card">
                <h6 class="fw-bold mb-3">Bookings by Status</h6>
                <canvas id="statusChart" height="220"></canvas>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="glass-card">
                <h6 class="fw-bold mb-3">Bookings by Vehicle Type</h6>
                <canvas id="typeChart" height="220"></canvas>
            </div>
        </div>
    </div>

    <h5 class="font-display fw-bold mb-3">Recent Bookings</h5>
    <div class="glass-card p-0 overflow-hidden">
        <table class="table table-borderless mb-0 align-middle">
            <thead>
            <tr class="text-secondary small">
                <th class="ps-4">Booking</th>
                <th>Customer</th>
                <th>Vehicle</th>
                <th>Status</th>
                <th class="pe-4">Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${recentBookings}">
                <td class="ps-4" th:text="${b.bookingCode}">ACP-100001</td>
                <td th:text="${b.ownerName}">Rohan Sharma</td>
                <td th:text="${b.brand + ' ' + b.model}">BMW 3 Series</td>
                <td><span class="status-pill" th:classappend="'status-' + ${#strings.toLowerCase(b.status)}" th:text="${b.status}">PENDING</span></td>
                <td class="pe-4" th:text="${b.preferredDate}">2026-07-24</td>
            </tr>
            <tr th:if="${#lists.isEmpty(recentBookings)}">
                <td colspan="5" class="text-center text-secondary py-4">No bookings yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
