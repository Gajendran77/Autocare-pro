<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Payments')}"></head>
<body>
<div th:replace="~{fragments/loading :: loading}"></div>
<div th:replace="~{fragments/admin-sidebar :: sidebar('payments')}"></div>

<main class="main-content">
    <div th:replace="~{fragments/topbar :: topbar('Payments')}"></div>

    <div class="glass-card p-0 overflow-hidden">
        <table class="table table-borderless mb-0 align-middle">
            <thead>
            <tr class="text-secondary small">
                <th class="ps-4">Booking</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Transaction ID</th>
                <th class="pe-4">Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${payments}">
                <td class="ps-4" th:text="${p.booking != null ? p.booking.bookingCode : '—'}">ACP-100001</td>
                <td th:text="'₹' + ${p.amount}">₹4,500.00</td>
                <td th:text="${p.method != null ? p.method : '—'}">CARD</td>
                <td th:text="${p.transactionId != null ? p.transactionId : '—'}">TXN123456</td>
                <td class="pe-4">
                    <span class="status-pill"
                          th:classappend="${p.status.name() == 'PAID'} ? 'status-completed' : (${p.status.name() == 'PENDING'} ? 'status-pending' : 'status-cancelled')"
                          th:text="${p.status}">PAID</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(payments)}">
                <td colspan="5" class="text-center text-secondary py-4">No payment records yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
