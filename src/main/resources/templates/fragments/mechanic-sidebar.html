<aside xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar(active)" class="sidebar">
    <a th:href="@{/}" class="brand-logo d-block mb-4 px-2"><i class="fa-solid fa-car-side me-1"></i> AutoCare Pro</a>
    <div class="px-2 mb-3">
        <span class="badge-premium"><i class="fa-solid fa-wrench"></i> Mechanic Bay</span>
    </div>
    <nav>
        <a th:href="@{/mechanic/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-gauge-high"></i> Assigned Jobs
        </a>
        <hr class="divider-glow my-3">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="sidebar-link border-0 bg-transparent w-100 text-start">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </form>
    </nav>
</aside>
