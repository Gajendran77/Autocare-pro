<aside xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar(active)" class="sidebar">
    <a th:href="@{/}" class="brand-logo d-block mb-4 px-2"><i class="fa-solid fa-car-side me-1"></i> AutoCare Pro</a>
    <nav>
        <a th:href="@{/customer/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-gauge-high"></i> Dashboard
        </a>
        <a th:href="@{/customer/book-service}" th:classappend="${active == 'book'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-calendar-plus"></i> Book Service
        </a>
        <a th:href="@{/customer/track-service}" th:classappend="${active == 'track'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-location-crosshairs"></i> Track Service
        </a>
        <a th:href="@{/customer/history}" th:classappend="${active == 'history'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-clock-rotate-left"></i> Service History
        </a>
        <a th:href="@{/customer/vehicles}" th:classappend="${active == 'vehicles'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-car"></i> My Vehicles
        </a>
        <a th:href="@{/customer/notifications}" th:classappend="${active == 'notifications'} ? 'active'" class="sidebar-link">
            <i class="fa-solid fa-bell"></i> Notifications
        </a>
        <hr class="divider-glow my-3">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="sidebar-link border-0 bg-transparent w-100 text-start">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </form>
    </nav>
</aside>
